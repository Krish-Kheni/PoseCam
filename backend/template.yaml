AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  PoseCam cloud upload backend. FastAPI on Lambda (HTTP API) issues short-lived
  presigned S3 URLs; the Android app uploads files DIRECTLY to S3. DynamoDB is the
  session/file catalog.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]{1,16}$"
    Description: Deployment stage label (tags and log naming only; resource names are generated by CloudFormation).
  ApiThrottleRateLimit:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Steady-state requests per second allowed on every route (HTTP API default route throttling).
  ApiThrottleBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Burst requests allowed on every route.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: CloudWatch Logs retention for the Lambda and API access log groups.
  AuthMode:
    Type: String
    Default: none
    AllowedValues: [none, device]
    Description: >
      none = NO AUTHENTICATION (temporary, abusable). device = reserved for future device auth;
      currently fails closed with HTTP 501 on every call.
  PresignedUrlTtlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Lifetime of presigned URLs. Keep short.
  NoncurrentVersionRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to keep superseded S3 object versions (re-uploads/overwrites).

Resources:
  # ------------------------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------------------------
  # Bucket and table names are generated by CloudFormation (never hard-coded); the Lambda
  # receives them through environment variables.
  SessionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionRetentionDays
      Tags:
        - Key: app
          Value: posecam
        - Key: stage
          Value: !Ref Stage

  SessionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SessionBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SessionBucket.Arn
              - !Sub "${SessionBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  SessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: app
          Value: posecam
        - Key: stage
          Value: !Ref Stage

  # ------------------------------------------------------------------------------------
  # Logging
  # ------------------------------------------------------------------------------------
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------------------------
  # IAM: least privilege, inline policy only (no managed policies, no "*" actions/resources
  # except where noted). Presigned URLs are signed with THIS role's credentials, so a URL can
  # never grant more than the role itself may do (PutObject / UploadPart under sessions/*).
  #
  # Note: S3 API names such as HeadObject, UploadPart, CreateMultipartUpload and
  # CompleteMultipartUpload are not IAM actions. They are authorised by s3:GetObject
  # (HeadObject, GetObject) and s3:PutObject (PutObject, CreateMultipartUpload, UploadPart,
  # CompleteMultipartUpload). ListParts needs s3:ListMultipartUploadParts, abort needs
  # s3:AbortMultipartUpload. DynamoDB TransactWriteItems is authorised through the underlying
  # PutItem/UpdateItem actions (no ConditionCheck is used).
  # ------------------------------------------------------------------------------------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: posecam-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn
              - Sid: ObjectAccessUnderSessionsPrefix
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub "${SessionBucket.Arn}/sessions/*"
              - Sid: ListBucketForCorrectHeadObjectErrors
                # Without s3:ListBucket, HeadObject on a MISSING key returns 403 instead of 404, which
                # would make "object missing" indistinguishable from "access denied" during verify.
                # The bucket is NEVER listed to discover sessions/files (DynamoDB is the catalog).
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SessionBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix": "sessions/*"
              - Sid: CatalogTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt SessionTable.Arn

  # ------------------------------------------------------------------------------------
  # API + compute
  # ------------------------------------------------------------------------------------
  # Default stage ($default) => the base URL has no stage prefix: https://<id>.execute-api.<region>.amazonaws.com/
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: PoseCam cloud upload API
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","method":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage","latencyMs":"$context.responseLatency"}
      Tags:
        app: posecam
        stage: !Ref Stage

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: app.main.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29 # must stay below the 30 s API Gateway integration timeout
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Environment:
        Variables:
          S3_BUCKET: !Ref SessionBucket
          DYNAMODB_TABLE: !Ref SessionTable
          AUTH_MODE: !Ref AuthMode
          PRESIGNED_URL_TTL_SECONDS: !Ref PresignedUrlTtlSeconds
          MULTIPART_THRESHOLD_BYTES: "104857600" # 100 MiB
          MULTIPART_PART_SIZE_BYTES: "16777216" # 16 MiB (S3 minimum is 5 MiB)
          MAX_SMALL_FILE_BYTES: "268435456" # 256 MiB
          MAX_LARGE_FILE_BYTES: "4294967296" # 4 GiB
          # AWS_REGION is provided by the Lambda runtime.
      Events:
        ProxyAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
      Tags:
        app: posecam
        stage: !Ref Stage

Outputs:
  ApiUrl:
    Description: Base URL for the Android app (posecam.cloud.baseUrl.release). Includes the trailing slash.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  BucketName:
    Description: Session data bucket (generated name).
    Value: !Ref SessionBucket
  TableName:
    Description: Session/file catalog table (generated name).
    Value: !Ref SessionTable
  FunctionName:
    Description: Lambda function name (for `sam logs`).
    Value: !Ref ApiFunction
